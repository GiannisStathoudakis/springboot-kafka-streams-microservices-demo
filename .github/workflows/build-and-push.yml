name: Build and Push

on:
  push:
    branches:
      - master
    paths:
      - 'ms-orders/**'
      - 'ms-payment/**'
      - 'ms-stock/**'
      - 'commons/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # BUILD SHARED DEPENDENCIES
  # -------------------------------------------------------------
  build-commons:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # NOTE: Tests are skipped here to accelerate local lab deployments.
      # In a production CI/CD pipeline, -DskipTests MUST be removed to enforce quality gates.
      - name: Build Commons Module
        run: mvn clean install -pl commons -am -DskipTests

      - name: Pass internal dependencies to Matrix
        uses: actions/upload-artifact@v7
        with:
          name: shared-maven-repo
          path: ~/.m2/repository/com/tribune/demo/
          retention-days: 1

  # -------------------------------------------------------------
  # MATRIX BUILD FOR MICROSERVICES
  # -------------------------------------------------------------
  build-and-push:
    needs: build-commons
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: 
          - ms-orders
          - ms-payment
          - ms-stock

    permissions:
      contents: read
      packages: write
      security-events: write # for Semgrep

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # for GitLeaks

      # -------------------------------------------------------------
      # PRE-BUILD SCANS
      # -------------------------------------------------------------
      - name: GitLeaks - Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Semgrep - SAST Scanner
        run: |
          docker run --rm -v "${PWD}:/src" -w "/src" semgrep/semgrep semgrep scan --config auto --sarif --output=semgrep.sarif ./${{ matrix.service }}

      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif

      # -------------------------------------------------------------
      # BUILD STAGE
      # -------------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Download internal dependencies from Job 1
        uses: actions/download-artifact@v8
        with:
          name: shared-maven-repo
          path: ~/.m2/repository/com/tribune/demo/

      # NOTE: Tests are skipped here to accelerate local lab deployments.
      # In a production CI/CD pipeline, -DskipTests MUST be removed to enforce quality gates.
      - name: Build with Maven
        run: mvn clean package -pl ${{ matrix.service }} -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          load: true
          push: false 
          tags: ghcr.io/giannisstathoudakis/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # -------------------------------------------------------------
      # POST-BUILD SCANS & PUSH
      # -------------------------------------------------------------
      # NOTE FOR PRODUCTION: In a real enterprise environment, exit-code MUST be set to '1' 
      # to strictly block deployments of vulnerable images. It is set to '0' here ONLY 
      # because this is a 3rd-party demo codebase used for infrastructure testing.
      - name: Trivy Scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/giannisstathoudakis/${{ matrix.service }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '0' # 1 -> 0 to prevent pipeline failure 
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

      - name: Push Docker Image to GHCR
        id: build-push
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          push: true
          sbom: true
          provenance: true
          tags: ghcr.io/giannisstathoudakis/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha