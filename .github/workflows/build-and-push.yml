name: Build and Push

on:
  push:
    branches:
      - master
    paths:
      - 'ms-orders/**'
      - 'ms-payment/**'
      - 'ms-stock/**'
      - 'commons/**'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: 
          - ms-orders
          - ms-payment
          - ms-stock

    permissions:
      contents: read
      packages: write
      security-events: write # for Semgrep

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # for GitLeaks

      # -------------------------------------------------------------
      # PRE-BUILD SCANS
      # -------------------------------------------------------------
      - name: GitLeaks - Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Cache Semgrep Rules
        uses: actions/cache@v6
        with:
          path: ~/.semgrep
          key: ${{ runner.os }}-semgrep-rules
          
      - name: Semgrep - SAST Scanner
        run: |
          python3 -m pip install semgrep
          
          semgrep scan --config auto --error --sarif --output=semgrep.sarif ./${{ matrix.service }}

      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif

      # -------------------------------------------------------------
      # BUILD STAGE
      # -------------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package -pl ${{ matrix.service }} -am -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Build and Push Docker Image
        id: build-push
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          push: true
          sbom: true
          provenance: true
          tags: ghcr.io/giannisstathoudakis/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # -------------------------------------------------------------
      # POST-BUILD SCANS & SIGNING
      # -------------------------------------------------------------
      - name: Cache Trivy Vulnerability Database
        uses: actions/cache@v6
        with:
          path: .trivycache/
          # This key ensures the cache refreshes once every 24 hours
          key: ${{ runner.os }}-trivy-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-trivy-

      - name: Trivy Scanner
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_CACHE_DIR: .trivycache/
        with:
          image-ref: ghcr.io/giannisstathoudakis/${{ matrix.service }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '1' 
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

      - name: Sign the published Docker image
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        run: |
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY ghcr.io/giannisstathoudakis/${{ matrix.service }}@${{ steps.build-push.outputs.digest }}