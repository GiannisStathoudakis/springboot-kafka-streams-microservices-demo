{{- range .Values.microservices }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app: {{ .name }}
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .name }}
  template:
    metadata:
      labels:
        app: {{ .name }}
    spec:
      serviceAccountName: {{ .name }}-sa
      securityContext:
        runAsNonRoot: {{ $.Values.security.runAsNonRoot }}
        runAsUser: {{ $.Values.security.runAsUser }}
        runAsGroup: {{ $.Values.security.runAsGroup }}
      initContainers:
        - name: init-agents
          image: curlimages/curl:latest
          command: ['sh', '-c']
          args:
            - curl -sL -o /agents/agent.jar https://github.com/grafana/grafana-opentelemetry-java/releases/download/v2.31.1/grafana-opentelemetry-java.jar && curl -sL -o /agents/pyroscope.jar https://github.com/grafana/pyroscope-java/releases/download/v2.9.2/pyroscope.jar
          securityContext:
            runAsUser: 1000
            runAsGroup: 3000
          volumeMounts:
            - name: agents-volume
              mountPath: /agents

      containers:
        - name: {{ .name }}
          image: "{{ $.Values.image.registry }}/{{ .name }}:{{ .tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          volumeMounts:
            - name: agents-volume
              mountPath: /agents
          ports:
            - containerPort: {{ .port }}
          env:
            # Redpanda connection
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: {{ $.Values.redpanda.bootstrapServers | quote }}
            
            # MySQL connection
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://{{ $.Values.mysql.host }}:{{ $.Values.mysql.port }}/{{ $.Values.mysql.databaseName }}?useSSL=false&allowPublicKeyRetrieval=true"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .name }}-db-secret
                  key: MYSQL_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .name }}-db-secret
                  key: MYSQL_PASSWORD
            # Dynamic JVM Memory Management (70% Heap, 20% Off-Heap Buffer)
            - name: JAVA_TOOL_OPTIONS
              value: "-javaagent:/agents/agent.jar -javaagent:/agents/pyroscope.jar -Xms{{ div (mul .resources.requests.memoryMb 70) 100 }}m -Xmx{{ div (mul .resources.limits.memoryMb 70) 100 }}m"

            # Alloy settigns
            - name: OTEL_SERVICE_NAME
              value: "{{ .name }}"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://alloy.grafana.svc.cluster.local:4317"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_METRICS_EXPORTER
              value: "otlp"
            - name: OTEL_LOGS_EXPORTER
              value: "otlp"
            - name: PYROSCOPE_SERVER_ADDRESS
              value: "http://pyroscope.pyroscope.svc.cluster.local:4040"
            - name: PYROSCOPE_APPLICATION_NAME
              value: "{{ .name }}"
            - name: PYROSCOPE_FORMAT
              value: "jfr"
            - name: PYROSCOPE_PROFILER_ALLOC
              value: "512k"
            - name: PYROSCOPE_ALLOC_LIVE
              value: "true"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.name={{ .name }},k8s.namespace.name={{ $.Release.Namespace }},k8s.cluster.name=my-prod-cluster"

          {{- if .isWebApi }}
          startupProbe:
            httpGet:
              path: /api/actuator/health/liveness
              port: {{ .port }}
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 15  

          livenessProbe:
            httpGet:
              path: /api/actuator/health/liveness
              port: {{ .port }}
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /api/actuator/health/readiness
              port: {{ .port }}
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          {{- end }}

          resources:
            requests:
              cpu: "{{ .resources.requests.cpuMilli }}m"
              memory: "{{ .resources.requests.memoryMb }}Mi"
            limits:
              cpu: "{{ .resources.limits.cpuMilli }}m"
              memory: "{{ .resources.limits.memoryMb }}Mi"
      volumes:
        - name: agents-volume
          emptyDir: {}
{{- end }}