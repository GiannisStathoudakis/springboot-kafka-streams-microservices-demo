{{- range .Values.microservices }}
{{- if (dig "autoscaling" "enabled" false .) }}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ .name }}-autoscaler
  namespace: {{ $.Release.Namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .name }}
  minReplicaCount: {{ .autoscaling.minReplicas | default 1 }}
  maxReplicaCount: {{ .autoscaling.maxReplicas | default 5 }}
  pollingInterval: 15
  cooldownPeriod: 300 # Wait 5 minutes of low load before initiating scale-down
  
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300 # Delay scale-down actions for 5 minutes
          policies:
            - type: Percent
              value: 50
              periodSeconds: 60 # Remove at most 50% of extra pods every minute

  triggers:
  # ===================================================================
  # 1. CPU Baseline Trigger
  # ===================================================================
  - type: prometheus
    metadata:
      serverAddress: {{ $.Values.autoscalingDefaults.serverAddress }}
      customHeaders: "X-Scope-OrgID={{ $.Values.autoscalingDefaults.tenant }}"
      query: sum(rate(container_cpu_usage_seconds_total{namespace="{{ $.Release.Namespace }}", pod=~"{{ .name }}-.*", container="{{ .name }}"}[2m])) * 1000
      threshold: "{{ div (mul .resources.limits.cpuMilli .autoscaling.targetPercentage) 100 }}"

  # ===================================================================
  # 2. RED Metrics Trigger (Request Rate via eBPF / Beyla & Mimir)
  # ===================================================================
  - type: prometheus
    metadata:
      serverAddress: {{ $.Values.autoscalingDefaults.serverAddress }}
      customHeaders: "X-Scope-OrgID={{ $.Values.autoscalingDefaults.tenant }}"
      # Measures the HTTP request rate per second for this specific microservice pod
      query: sum(rate(http_server_duration_milliseconds_count{namespace="{{ $.Release.Namespace }}", service_name="{{ .name }}"}[2m]))
      threshold: '10' # Scale-out immediately if average requests/sec per pod exceeds this limit
{{- end }}
{{- end }}