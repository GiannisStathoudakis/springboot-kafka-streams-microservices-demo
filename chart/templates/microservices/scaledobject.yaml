{{- range .Values.microservices }}
{{- if (dig "autoscaling" "enabled" false .) }}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ .name }}-autoscaler
  namespace: {{ $.Release.Namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .name }}
  minReplicaCount: {{ .autoscaling.minReplicas | default 1 }}
  maxReplicaCount: {{ .autoscaling.maxReplicas | default 5 }}
  pollingInterval: 15
  cooldownPeriod: 300 # Wait 5 minutes of low load before initiating scale-down
  
  # Advanced behavior to prevent thrashing/flapping during scale-down
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300 # Delay scale-down actions for 5 minutes
          policies:
            - type: Percent
              value: 50
              periodSeconds: 60 # Remove at most 50% of extra pods every minute

  triggers:
  # ===================================================================
  # Latency (P90 Duration) Trigger (Request Rate via eBPF / Beyla & Mimir)
  # ===================================================================
  - type: prometheus
    metadata:
      serverAddress: {{ $.Values.autoscalingDefaults.serverAddress }}
      customHeaders: "X-Scope-OrgID={{ $.Values.autoscalingDefaults.tenant }}"
      # Measures the 90th percentile (P90) latency in milliseconds for requests
      query: histogram_quantile(0.90, sum(rate(http_server_duration_milliseconds_bucket{namespace="{{ $.Release.Namespace }}", service_name="{{ .name }}"}[2m])) by (le))
      threshold: '500' # Scale out immediately if P90 latency exceeds 500ms per pod
{{- end }}
{{- end }}